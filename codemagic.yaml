workflows:
  ios-simulator-appetize:
    name: KAP iOS Simulator Build (Appetize)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group in Codemagic UI (Teams > Group variables)
        # and add APPETIZE_API_TOKEN there (mark it "secure").
        - appetize_credentials
      vars:
        XCODE_SCHEME: "KAP"                             # change to your scheme name (see "Available schemes" in build log)
        APP_NAME: "KAP"                                  # used to name the zip
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.konan
        - $HOME/.gradle/wrapper

    scripts:
      - name: Install CocoaPods dependencies (skip if using SPM/direct framework embedding)
        script: |
          if [ -f "iosApp/Podfile" ]; then
            cd iosApp && pod install
          fi

      - name: Locate Xcode project or workspace
        script: |
          set -e
          echo "Repo contents (top 3 levels):"
          find . -maxdepth 3 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) ! -path "*/Pods/*" ! -path "*/DerivedData/*"

          WORKSPACE_PATH=$(find . -maxdepth 3 -name "*.xcworkspace" ! -path "*/Pods/*" ! -path "*/DerivedData/*" ! -path "*.xcodeproj/*" | head -n 1)
          if [ -n "$WORKSPACE_PATH" ]; then
            WORKSPACE_PATH="${WORKSPACE_PATH#./}"
            echo "Using workspace: $WORKSPACE_PATH"
            echo "FOUND_XCODE_WORKSPACE=$WORKSPACE_PATH" >> "$CM_ENV"
          else
            PROJECT_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" ! -path "*/DerivedData/*" | head -n 1)
            if [ -z "$PROJECT_PATH" ]; then
              echo "ERROR: No .xcworkspace or .xcodeproj found in repo. Check your folder structure."
              exit 1
            fi
            PROJECT_PATH="${PROJECT_PATH#./}"
            echo "No workspace found, using project: $PROJECT_PATH"
            echo "FOUND_XCODE_PROJECT=$PROJECT_PATH" >> "$CM_ENV"
          fi

          echo "Available schemes:"
          if [ -n "$WORKSPACE_PATH" ]; then
            xcodebuild -list -workspace "$WORKSPACE_PATH" || true
          else
            xcodebuild -list -project "$PROJECT_PATH" || true
          fi

      - name: Build iOS app for simulator
        script: |
          set -e -o pipefail
          # NOTE: we do NOT call ./gradlew embedAndSignAppleFrameworkForXcode manually here.
          # That task (and syncComposeResourcesForIos, if you use Compose Multiplatform
          # resources) requires Xcode-provided env vars (PLATFORM_NAME, ARCHS, SDK_NAME, etc.)
          # which only exist when Gradle is invoked from Xcode's own "Run Script" build phase.
          # xcodebuild below triggers that build phase automatically, with the correct
          # simulator context, so the shared framework gets built as part of this step.
          chmod +x ./gradlew

          if [ -n "$FOUND_XCODE_WORKSPACE" ]; then
            BUILD_TARGET_FLAG="-workspace"
            BUILD_TARGET_PATH="$FOUND_XCODE_WORKSPACE"
          else
            BUILD_TARGET_FLAG="-project"
            BUILD_TARGET_PATH="$FOUND_XCODE_PROJECT"
          fi
          echo "Building with $BUILD_TARGET_FLAG $BUILD_TARGET_PATH, scheme $XCODE_SCHEME"

          xcodebuild build \
            $BUILD_TARGET_FLAG "$BUILD_TARGET_PATH" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Zip .app for Appetize
        script: |
          set -e
          cd "$CM_BUILD_DIR/build/DerivedData/Build/Products/Debug-iphonesimulator"
          APP_PATH=$(find . -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in Debug-iphonesimulator products dir"
            exit 1
          fi
          zip -r -X "$CM_BUILD_DIR/$APP_NAME.zip" "$APP_PATH"

      - name: Upload build to Appetize
        script: |
          set -e
          RESPONSE=$(curl -s "https://api.appetize.io/v1/apps" \
            -F "file=@$CM_BUILD_DIR/$APP_NAME.zip" \
            -F "platform=ios" \
            -u "${APPETIZE_API_TOKEN}:")
          echo "Appetize response: $RESPONSE"

    artifacts:
      - "$CM_BUILD_DIR/*.zip"
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app

    publishing:
      email:
        recipients:
          - your-email@example.com   # change to your email
        notify:
          success: true
          failure: true


