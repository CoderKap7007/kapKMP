workflows:
  ios-simulator-appetize:
    name: iOS Simulator Build (Appetize)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group in Codemagic UI (Teams > Group variables)
        # and add APPETIZE_API_TOKEN there (mark it "secure").
        - appetize_credentials
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace"   # change if your workspace path differs
        XCODE_SCHEME: "iosApp"                          # change to your scheme name
        APP_NAME: "MyKmpApp"                             # used to name the zip
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.konan
        - $HOME/.gradle/wrapper

    scripts:
      - name: Install CocoaPods dependencies (skip if using SPM/direct framework embedding)
        script: |
          if [ -f "iosApp/Podfile" ]; then
            cd iosApp && pod install
          fi

      - name: Build shared KMP framework for simulator
        script: |
          set -e
          echo "Working dir: $(pwd)"
          ls -la gradlew || (echo "gradlew not found in $(pwd)" && exit 1)
          chmod +x ./gradlew
          ls -la gradlew
          # Adjust the Gradle task name to match your shared module's target.
          # This is the standard task name generated by the KMP Cocoapods/Xcode-Gradle plugin.
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode \
            -PXCODE_SDK=iphonesimulator \
            -PXCODE_CONFIGURATION=Debug \
            -PXCODE_ARCHS=arm64

      - name: Build iOS app for simulator
        script: |
          set -e
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Zip .app for Appetize
        script: |
          set -e
          cd "$CM_BUILD_DIR/build/DerivedData/Build/Products/Debug-iphonesimulator"
          APP_PATH=$(find . -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in Debug-iphonesimulator products dir"
            exit 1
          fi
          zip -r -X "$CM_BUILD_DIR/$APP_NAME.zip" "$APP_PATH"

      - name: Upload build to Appetize
        script: |
          set -e
          RESPONSE=$(curl -s "https://api.appetize.io/v1/apps" \
            -F "file=@$CM_BUILD_DIR/$APP_NAME.zip" \
            -F "platform=ios" \
            -u "${APPETIZE_API_TOKEN}:")
          echo "Appetize response: $RESPONSE"

    artifacts:
      - "$CM_BUILD_DIR/*.zip"
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app

    publishing:
      email:
        recipients:
          - your-email@example.com   # change to your email
        notify:
          success: true
          failure: true

          success: true
          failure: true
